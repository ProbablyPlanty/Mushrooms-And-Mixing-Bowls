<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mushrooms & Mixing Bowls</title>

    <style>
        /* Header */
        header {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 70px;
        }

        /* Menu button */
        #menu-button {
            position: absolute;
            left: 20px;
            font-size: 28px;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* Website title */
        h1 {
            margin: 0;
        }

        /* Sidebar */
        #sidebar {
            position: fixed;
            top: 0;
            left: -250px;
            width: 250px;
            height: 100%;
            background: white;
            border-right: 1px solid black;
            transition: left 0.3s ease;
            padding-top: 70px;
            z-index: 1000;
        }

        /* Sidebar when open */
        #sidebar.open {
            left: 0;
        }

        /* Navigation links */
        #sidebar a {
            display: block;
            padding: 15px 20px;
            text-decoration: none;
            color: black;
        }
    </style>
</head>

<body>

    <header>
        <button id="menu-button" aria-label="Open navigation menu">☰</button>

        <h1>Mushrooms & Mixing Bowls</h1>
    </header>

    <nav id="sidebar">
        <a href="#">Home</a>
        <a href="#">All Recipes</a>
        <a href="#">Breakfast</a>
        <a href="#">Lunch</a>
        <a href="#">Dinner</a>
        <a href="#">Baking</a>
        <a href="#">Drinks</a>
    </nav>

    <main>
        <p>Recipes I've made, tested, and approved.</p>
    </main>

    <script>
        const menuButton = document.getElementById("menu-button");
        const sidebar = document.getElementById("sidebar");

        menuButton.addEventListener("click", function () {
            sidebar.classList.toggle("open");
        });
    </script>

</body>
</html>
